name: Update Sing-Box Config

on:
  schedule:
    # هر ۴ ساعت یک‌بار اجرا شود
    - cron: '0 */4 * * *'
  workflow_dispatch:  # امکان اجرای دستی

permissions:
  contents: write

jobs:
  update-config:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Run subscription converter
        env:
          SUB_LINK: ${{ secrets.SUB_LINK }}
        run: python converter.py

      - name: Commit changes if updated
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "chore: auto-update sing-box config [skip ci]"
          file_pattern: javidbox.json
          commit_user_name: "github-actions[bot]"
          commit_user_email: "github-actions[bot]@users.noreply.github.com"
