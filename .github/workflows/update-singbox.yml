name: Update Sing-Box config

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch: {}

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests pybase64 urllib3

      - name: Run converter
        env:
          SUB_LINK: ${{ secrets.SUB_LINK }}
        run: |
          python -u converter.py

      - name: Commit javidbox.json if changed
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: chore: auto-update sing-box config
          file_pattern: javidbox.json
