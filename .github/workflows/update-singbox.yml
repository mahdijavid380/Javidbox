name: Update Sing-box Config

on:
  schedule:
    - cron: '0 */4 * * *'
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - uses: actions/setup-python@v4
        with:
          python-version: '3.10'
      - name: نصب وابستگی‌ها
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
      - name: اجرای تبدیل‌کننده
        env:
          SUB_LINK: ${{ secrets.SUB_LINK }}
        run: |
          python converter.py
      - name: بررسی وجود فایل خروجی
        run: |
          if [ -f "javidbox.json" ]; then
            echo "✅ فایل javidbox.json وجود دارد"
            ls -la javidbox.json
          else
            echo "❌ فایل javidbox.json پیدا نشد!"
            exit 1
          fi
      - name: ارسال تغییرات
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@github.com"
          git add javidbox.json
          if git diff --staged --quiet; then
            echo "ℹ️ هیچ تغییری در فایل وجود ندارد."
          else
            git commit -m "به‌روزرسانی خودکار javidbox.json"
            git push
            echo "✅ تغییرات با موفقیت ارسال شد."
          fi
